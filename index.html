<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>DropDesign</title>
    <meta
      name="description"
      content="A Kanban board for small teams: drag tasks between columns, switch between grid, list, column and row views, comment on tasks, and work in light or dark mode."
    />
    <link rel="canonical" href="https://dropdesign-ashy.vercel.app/" />
    <!-- Link previews (Open Graph, also read by LinkedIn, Slack and Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DropDesign" />
    <meta property="og:title" content="DropDesign: a Kanban board for small teams" />
    <meta
      property="og:description"
      content="Drag tasks between columns, switch views, comment on tasks, and try it instantly with the demo board."
    />
    <meta property="og:url" content="https://dropdesign-ashy.vercel.app/" />
    <meta property="og:image" content="https://dropdesign-ashy.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="The DropDesign board in light mode, with tasks in To Do, In Progress and Completed columns" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DropDesign: a Kanban board for small teams" />
    <meta
      name="twitter:description"
      content="Drag tasks between columns, switch views, comment on tasks, and try it instantly with the demo board."
    />
    <meta name="twitter:image" content="https://dropdesign-ashy.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="The DropDesign board in light mode, with tasks in To Do, In Progress and Completed columns" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Pick the theme before anything renders, so dark-mode users never see a white flash:
      // the saved choice (see src/theme.ts), otherwise the system setting. colorScheme also
      // darkens the browser's own canvas before the stylesheet has loaded.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
